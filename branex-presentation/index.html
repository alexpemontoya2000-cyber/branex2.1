  <meta name="description" content="Branex transforma datos desorganizados en dashboards inteligentes con IA. Entrega en 1-2 semanas. Medellín, Colombia." />
  <meta property="og:title" content="Branex — Donde los datos se convierten en decisiones" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body { background: #060B18; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes pulse-glow { 0%,100%{opacity:0.4} 50%{opacity:1} }
    @keyframes float-up { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0F1B35; }
    ::-webkit-scrollbar-thumb { background: #00D4AA44; border-radius: 2px; }
  </style>
</head>
